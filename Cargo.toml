[workspace]
members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["notwinterdust <notwinterdust@gmail.com>"]
license = "MIT"
repository = "https://github.com/notwinterdust/discord-rust"

[package]
name = "discord-rust"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "A feature-rich, standard-library-only Discord API and Gateway library for Rust."
readme = "README.md"

[dependencies]
abc = { package = "discord-rust-abc", path = "crates/abc", version = "0.1.0" }
app = { package = "discord-rust-app", path = "crates/app", version = "0.1.0" }
clients = { package = "discord-rust-clients", path = "crates/clients", version = "0.1.0" }
commands = { package = "discord-rust-commands", path = "crates/commands", version = "0.1.0" }
data = { package = "discord-rust-data", path = "crates/data", version = "0.1.0" }
enums = { package = "discord-rust-enums", path = "crates/enums", version = "0.1.0" }
event = { package = "discord-rust-event", path = "crates/event", version = "0.1.0" }
except = { package = "discord-rust-except", path = "crates/except", version = "0.1.0" }
log = { package = "discord-rust-log", path = "crates/log", version = "0.1.0" }
models = { package = "discord-rust-models", path = "crates/models", version = "0.1.0" }
util = { package = "discord-rust-util", path = "crates/util", version = "0.1.0" }
version = { package = "discord-rust-version", path = "crates/version", version = "0.1.0" }
voice = { package = "discord-rust-voice", path = "crates/voice", version = "0.1.0" }
webhook = { package = "discord-rust-webhook", path = "crates/webhook", version = "0.1.0" }
