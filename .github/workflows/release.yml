name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: false
        type: string
      publish_crates_io:
        description: "Publish crates to crates.io"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo test --workspace --all-targets
      - run: cargo doc --workspace --no-deps

  github-release:
    name: Create GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$PUSH_TAG}"
          if [ -z "$tag" ]; then
            echo "Error: Release tag could not be determined."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Replacing it."
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" --generate-notes --title "discord-rust $TAG"

  publish-crates-io:
    name: Publish to crates.io
    needs: [verify, github-release]
    runs-on: ubuntu-latest
    if: ${{ inputs.publish_crates_io != false }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish crates in topological dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is not set. Skipping crates.io publish."
            exit 0
          fi

          CRATES=(
            discord-rust-abc
            discord-rust-enums
            discord-rust-except
            discord-rust-log
            discord-rust-util
            discord-rust-version
            discord-rust-voice
            discord-rust-macros
            discord-rust-commands
            discord-rust-webhook
            discord-rust-data
            discord-rust-app
            discord-rust-models
            discord-rust-event
            discord-rust-clients
            discord-rust
          )

          metadata="$(cargo metadata --no-deps --format-version 1)"

          # Give crates.io time to index each published crate before the next
          # dependent crate is pushed.
          COOLDOWN_SECONDS=720

          crate_version() {
            jq -r --arg name "$1" \
              '.packages[] | select(.name == $name) | .version' <<<"$metadata"
          }

          already_published() {
            local status
            status="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: discord-rust-release-workflow' \
              "https://crates.io/api/v1/crates/$1/$2")"
            # crates.io asks clients to stay below one request per second.
            sleep 1
            case "$status" in
              200) return 0 ;;
              404) return 1 ;;
              *)
                echo "Unexpected crates.io response ($status) for $1 $2." >&2
                exit 1
                ;;
            esac
          }

          for crate in "${CRATES[@]}"; do
            version="$(crate_version "$crate")"
            if [ -z "$version" ]; then
              echo "Could not determine the workspace version of $crate." >&2
              exit 1
            fi
            if already_published "$crate" "$version"; then
              echo "Skipping $crate $version: already published on crates.io."
              continue
            fi
            echo "Publishing crate: $crate $version..."
            cargo publish -p "$crate" --token "$CARGO_REGISTRY_TOKEN"
            echo "Cooling down for $((COOLDOWN_SECONDS / 60)) minutes before the next crate..."
            sleep "$COOLDOWN_SECONDS"
          done
          echo "All crates published successfully to crates.io!"
