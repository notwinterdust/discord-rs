name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: false
        type: string
      publish_crates_io:
        description: "Publish crates to crates.io"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo test --workspace --all-targets
      - run: cargo doc --workspace --no-deps

  github-release:
    name: Create GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$PUSH_TAG}"
          if [ -z "$tag" ]; then
            echo "Error: Release tag could not be determined."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" --generate-notes --title "discord-rust $TAG"

  publish-crates-io:
    name: Publish to crates.io
    needs: [verify, github-release]
    runs-on: ubuntu-latest
    if: ${{ (inputs.publish_crates_io != false) && (secrets.CARGO_REGISTRY_TOKEN != '') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish crates in topological dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          CRATES=(
            discord-rust-abc
            discord-rust-enums
            discord-rust-except
            discord-rust-log
            discord-rust-util
            discord-rust-version
            discord-rust-voice
            discord-rust-commands
            discord-rust-webhook
            discord-rust-data
            discord-rust-app
            discord-rust-models
            discord-rust-event
            discord-rust-clients
            discord-rust
          )

          for crate in "${CRATES[@]}"; do
            echo "Publishing crate: $crate..."
            cargo publish -p "$crate" --token "$CARGO_REGISTRY_TOKEN"
            echo "Sleeping 15 seconds to allow crates.io index to update..."
            sleep 15
          done
          echo "All crates published successfully to crates.io!"
