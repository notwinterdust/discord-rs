name: Live Discord integration

# Runs #[ignore]d tests against the real Discord API using a dedicated
# test bot in a private test guild. Never runs on PRs (secrets aren't
# available to forks, and we don't want untrusted code using the token).


# Serialize runs so we don't trip rate limits or fight over the test guild.
concurrency:
  group: discord-integration
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    environment: discord-integration   # add required secrets to this environment
    timeout-minutes: 15
    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      TEST_GUILD_ID: ${{ secrets.TEST_GUILD_ID }}
      TEST_CHANNEL_ID: ${{ secrets.TEST_CHANNEL_ID }}
      RUST_LOG: debug
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libopus-dev cmake pkg-config
      - run: cargo test --workspace --all-features -- --ignored --test-threads=1
